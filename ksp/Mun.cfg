// Kittopia's stock Mun dump lists these five modifiers as terrain height writers.
// Keep the PQS sphere, QuadMeshColliders, colour, and surface material.
@Kopernicus:AFTER[Kopernicus]
{
    @Body[Mun]
    {
        @Template
        {
            %removePQSMods = VertexHeightMap, VertexSimplexHeight, VertexHeightNoiseVertHeight, VoronoiCraters, FlattenArea
        }
        @Properties
        {
            %radius = 1735016.0963443539
            %gravParameter = 4902778000000
            %rotates = true
            %tidallyLocked = false
            %rotationPeriod = 2360591.6
            %initialRotation = 0
        }
        @ScaledVersion
        {
            %sphericalModel = true
        }
    }
}
